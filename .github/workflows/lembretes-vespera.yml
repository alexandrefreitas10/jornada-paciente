# Lembrete da véspera: chama a rota que avisa quem tem aplicação amanhã.
#
# POR QUE AQUI E NÃO NUM CRON JOB DO RENDER: o formulário de criação do Render
# falhava com "Failed to fetch (api.render.com)" no navegador do dono, e não
# havia como contornar pela tela. O GitHub já hospeda este código, o
# agendamento é de graça, e o segredo vive em Settings › Secrets.
#
# DUAS LIMITAÇÕES CONHECIDAS, aceitas de propósito:
#  1. O GitHub às vezes atrasa alguns minutos o horário agendado. Para um
#     lembrete de véspera que sai de manhã, não muda nada.
#  2. O GitHub DESLIGA agendamentos em repositório parado há 60 dias. Este
#     repositório recebe commits quase todo dia, mas se um dia os lembretes
#     pararem sozinhos, é o primeiro lugar a olhar.

name: Lembrete da véspera

on:
  schedule:
    # 12:00 UTC = 9h de Brasília. O GitHub só aceita UTC.
    - cron: '0 12 * * *'
  # Permite disparar na mão pela aba Actions, para testar sem esperar um dia.
  workflow_dispatch:

jobs:
  avisar:
    runs-on: ubuntu-latest
    steps:
      - name: Chamar a rota de lembretes
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "CRON_SECRET não está configurado em Settings › Secrets." >&2
            echo "Sem ele a rota recusa a chamada e nenhum lembrete sai." >&2
            exit 1
          fi
          # --retry é seguro aqui: a rota marca o lembrete como enviado ANTES
          # de enviar, com chave primária no agendamento, então repetir a
          # chamada não manda o mesmo aviso duas vezes.
          #
          # --max-time 120 porque a instância do Render pode estar hibernando
          # e a primeira chamada do dia leva perto de um minuto para acordar.
          #
          # -f faz o passo FALHAR em erro HTTP: assim um segredo errado fica
          # vermelho na aba Actions em vez de passar despercebido todo dia.
          curl -fsS \
            --retry 3 --retry-delay 15 --retry-all-errors \
            --max-time 120 \
            -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            https://jornada-paciente.onrender.com/api/cron/lembretes
          echo
